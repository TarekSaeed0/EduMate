<app-navbar />

<div class="tasks-section">
    <div class="search-bar">
      <input type="text" name="FAQ-Search" id="search" placeholder="Search Assignments...">
    </div>
    <div class="tasks-container">
      @for (studentTask of studentTasks(); track studentTask.id) {
        <table class="task-item" (click)="viewTask(studentTask)">
          <tr>
            <td>Title:</td>
            <td>{{ studentTask.task.title }}</td>
          </tr>
          
          <tr>
            <td>Due Date:</td>
            @if (studentTask.task.dueDate == null) {
              <td>N/A</td>
            } @else {
              <td>{{ studentTask.task.dueDate.toLocaleString() }}</td>
            }
          </tr>
        </table>
      } @empty {
        <p>No tasks assigned.</p>
      }
    </div>
</div>
