<app-navbar />

<div class="tasks-section">

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search Assignments..." />
  </div>

  <div class="tasks-container">

    @for (studentTask of studentTasks(); track studentTask.task.id) {

      <div class="task-item" (click)="viewTask(studentTask)">
        <div class="row">
          <span class="label">Title:</span>
          <span class="value">{{ studentTask.task.title }}</span>
        </div>

        <div class="row">
          <span class="label">Due Date:</span>
          @if (studentTask.task.dueDate == null) {
            <span class="value">N/A</span>
          } @else {
            <span class="value">{{ studentTask.task.dueDate.toLocaleString() }}</span>
          }
        </div>
      </div>

    } @empty {
      <p>No tasks assigned.</p>
    }

  </div>

</div>
