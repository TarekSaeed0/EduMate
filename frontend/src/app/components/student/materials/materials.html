<app-navbar></app-navbar>

<div class="materials-container">

  <!-- Page Header -->
  <div class="page-header">
    <h1>Course Materials</h1>
    <p>Access your study resources and shared documents.</p>
  </div>

  <!-- Main Layout -->
  <div class="materials-layout">

    <!-- Sidebar Navigation -->
    <aside class="course-nav">
      <h3>Your Courses</h3>

      <div class="nav-buttons">
        <button (click)="showMaterials('Computer Organization')">Computer Organization</button>
        <button (click)="showMaterials('Programming 2')">Programming 2</button>
        <button (click)="showMaterials('Discrete Structures')">Discrete Structures</button>
        <button (click)="showMaterials('Numerical Computing')">Numerical Computing</button>
        <button (click)="showMaterials('Human Computer Interaction')">Human Computer Interaction</button>
        <button (click)="showMaterials('Communication Skills')">Communication Skills</button>

        <!-- Future dynamic version -->
        <!--
        @for (reg of registrations; track reg.offering.course.id) {
          <button
            (click)="selectCourse(reg.offering.course.id)"
            [class.active]="selectedCourseId === reg.offering.course.id">
            {{ reg.offering.course.code }}
          </button>
        }
        -->
      </div>
    </aside>

    <!-- File Viewer -->
    <main class="source-viewer">

      <div style="font-size: 40px; padding-bottom: 15px;">
        {{ course() }}
      </div>

      @if (list.length === 0) {
        <!-- Empty state -->
        <div class="empty-state">
          <p>No materials available for this course.</p>
        </div>
      }
      @else {
          <!-- Materials Grid -->
          <div class="source-grid">
            @for (item of list; track item) {
              <div class="source-card">

                <div class="source-icon">
                  {{ item.title }}
                </div>

                <div class="source-details">
                  <a href="{{ item.link }}">{{ item.link }}</a>
                  <p>{{ item.attachment }}</p>
                </div>
                <button>
                  Download
                </button>

              </div>
            }
          </div>
        }
        <div class="add-more">
            <p>Add Sources</p>

            <label for="title">Title: </label>
            <input type="text" id="title" [(ngModel)]="title">

            <label for="link">Link: </label>
            <input type="text" id="link" [(ngModel)]="link">

            <!--
            <div>
              <label for="attach">attachment: </label>
              <button>upload</button>
            </div>
            -->

            <button (click)="addSource()">Add</button>
        </div>

    </main>
  </div>
</div>
