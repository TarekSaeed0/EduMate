<app-navbar></app-navbar>

<div class="materials-container">
  <div class="page-header">
    <h1>Course Materials</h1>
    <p>Access your study resources and shared documents.</p>
  </div>

  <div class="materials-layout">
    <aside class="course-nav">
      <h3>YOUR COURSES</h3>
      <div class="nav-buttons">
        <button
          *ngFor="let reg of registrations"
          (click)="selectCourse(reg.offering.course.id)"
          [class.active]="selectedCourseId === reg.offering.course.id">
          {{ reg.offering.course.code }}
        </button>
      </div>
    </aside>

    <main class="file-viewer">
      <div class="empty-state" *ngIf="filteredMaterials.length === 0">
        <p>No materials available for this course.</p>
      </div>

      <div class="file-grid" *ngIf="filteredMaterials.length > 0">
        <div class="file-card" *ngFor="let file of filteredMaterials">
          <div class="file-icon" [attr.data-type]="file.type">
            {{ file.type }}
          </div>
          <div class="file-details">
            <h3>{{ file.name }}</h3>
            <p>{{ file.size }} • Uploaded: {{ file.uploadDate }}</p>
          </div>
          <button class="download-btn" (click)="onDownload(file.name)">
            Download
          </button>
        </div>
      </div>
    </main>
  </div>
</div>
