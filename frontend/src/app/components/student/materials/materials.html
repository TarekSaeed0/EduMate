<app-navbar></app-navbar>

<div class="materials-container">
  <div class="page-header">
    <h1>Course Materials</h1>
    <p>Official study resources from the database.</p>
  </div>

  <div class="materials-layout">
    <aside class="course-nav">
      <h3>Available Courses</h3>
      <div class="nav-buttons">
        <button *ngFor="let c of coursesList()"
                (click)="selectCourse(c.id)"
                [class.active]="selectedCourseId() === c.id">
          {{ c.name }}
        </button>
      </div>
    </aside>

    <main class="source-viewer">
      <div class="empty-state" *ngIf="filteredList().length === 0">
        <p>No materials have been uploaded for this course yet.</p>
      </div>

      <div class="source-grid" *ngIf="filteredList().length > 0">
        <div *ngFor="let item of filteredList()" class="source-card">
          <div class="card-header">
            <div class="card-info">
              <span class="course-tag">{{ item.course?.code }}</span>
              <h4 class="material-title">{{ item.title }}</h4>
            </div>

            <div class="dropdown">
              <button class="dropbtn">⋮</button>
              <div class="dropdown-content">
                <a (click)="onOpen(item.url)">Open Resource</a>
                <a (click)="onDelete(item.id)" style="color: red;">Delete</a>
              </div>
            </div>
          </div>
          <p class="url-text">{{ item.url }}</p>
          <button class="view-btn" (click)="onOpen(item.url)">View Material</button>
        </div>
      </div>
    </main>
  </div>
</div>
