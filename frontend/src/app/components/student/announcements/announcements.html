<app-navbar></app-navbar>

<div class="announcements-wrapper">
  <div class="header-area">
    <div class="title-text">
      <h1>Announcements</h1>
      <p>Stay updated with the latest campus and course news.</p>
    </div>
  </div>

  <div class="layout-grid">
    <aside class="sidebar-filters">
      <h3>FILTERS</h3>
      <div class="filter-options">
        <div class="filter-item" [class.active]="activeFilter === 'ALL'" (click)="setFilter('ALL')">
          <span class="dot"></span> All Announcements
        </div>
        <div class="filter-item" [class.active]="activeFilter === 'COURSE'" (click)="setFilter('COURSE')">
          <span class="dot"></span> Course Specific
        </div>
      </div>

      <div class="course-select-box" *ngIf="activeFilter === 'COURSE'">
        <label>Pick a Course</label>
        <select [(ngModel)]="selectedCourseId">
          <option [ngValue]="null">Select from list...</option>
          <option *ngFor="let c of courses" [ngValue]="c.id">{{ c.name }}</option>
        </select>
      </div>
    </aside>

    <main class="feed-area">
      <div class="announcement-card" *ngFor="let post of filteredAnnouncements">
        <div class="card-top">
          <span class="type-badge" [ngClass]="post.scopeType.toLowerCase()">{{ post.scopeType }}</span>

          <div class="admin-controls" *ngIf="isAdmin">
            <button class="btn-edit" (click)="openEditModal(post)">Edit</button>
            <button class="btn-delete" (click)="deletePost(post.id)">Delete</button>
          </div>
        </div>

        <div class="card-body">
          <h2>{{ post.title }}</h2>
          <p>{{ post.content }}</p>
        </div>

        <div class="card-bottom">
          <span class="timestamp" *ngIf="post.createdAt">📅 {{ post.createdAt | date:'mediumDate' }}</span>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" *ngIf="showEditModal">
  <div class="modal-content" *ngIf="editingPost">
    <div class="modal-header">
      <h2>Edit Announcement</h2>
      <button class="x-btn" (click)="closeEditModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="input-field">
        <label>Title</label>
        <input type="text" [(ngModel)]="editingPost!.title">
      </div>
      <div class="input-field">
        <label>Message</label>
        <textarea [(ngModel)]="editingPost!.content" rows="6"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" (click)="closeEditModal()">Cancel</button>
      <button class="save-btn" (click)="updatePost()">Save Changes</button>
    </div>
  </div>
</div>
