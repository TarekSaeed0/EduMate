<app-navbar></app-navbar>

<div class="page-container">
  <div class="header-section">
    <h1>Announcements</h1>
    <button class="btn-create" (click)="toggleModal()">+ NEW POST</button>
  </div>

  <div class="main-grid">
    <aside class="filter-sidebar">
      <h3>Filters</h3>
      <div class="filter-list">
        <button class="filter-btn active" (click)="setFilter('ALL')">All Announcements</button>
        <button class="filter-btn" (click)="setFilter('COURSE')">Course Specific</button>
      </div>
    </aside>

    <main class="feed-area">
      <div class="post-card" *ngFor="let post of filteredAnnouncements">
        <div class="card-meta">
          <span class="badge">{{ post.scopeType }}</span>
        </div>
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>
      </div>
    </main>
  </div>
</div>
