@if (this.authenticationService.isSignedIn()) {
  <h1>{{ greeting() }}</h1>
  @if (this.student()) {
    <table>
      <tr>
        <td>ID:</td>
        <td>{{ student()!.id }}</td>
      </tr>
      <tr>
        <td>Name:</td>
        <td>{{ student()!.name }}</td>
      </tr>
      <tr>
        <td>Email:</td>
        <td>{{ student()!.email }}</td>
      </tr>
      <tr>
        <td>Gender:</td>
        <td>{{ student()!.gender }}</td>
      </tr>
    </table>
  } @else {
    <p>Loading student information...</p>
  }
  <button (click)="signout()">Sign Out</button>
} @else {
  <a routerLink="/signin"><h1>You must sign in first</h1></a>
}
