<span #overlay class="overlay"></span>

<nav class="navbar">
  <div class="nav-left">
    <button id="main-menu" class="main-menu" (click)="toggleSidebar($event)">
      <span></span><span></span><span></span>
    </button>
    <h1 class="web-title">
      <a (click)="navigateTo('home')" style="cursor: pointer;">
        <span id="Edu">Edu</span><span id="Mate">Mate</span>
      </a>
    </h1>
  </div>

  <div class="nav-right">
    <div class="profile-photo"></div>
    <div class="dropdown" [class.open]="dropdownOpen">
      <div class="dropdown-btn" (click)="toggleDropdown()">Profile <span class="arrow"></span></div>
      <div class="dropdown-menu">
        <div class="dropdown-item" (click)="onProfileSelect('main')">Your Account</div>
        <div class="dropdown-item" (click)="onProfileSelect('logout')">Sign Out</div>
      </div>
    </div>
  </div>
</nav>

<div #sidebar class="sidebar">
  <ul>
    <li><a (click)="navigateTo('home')" style="cursor: pointer;"><span>Home Page</span></a></li>
    <li><a (click)="navigateTo('student/timetable')" style="cursor: pointer;"><span>Time Table</span></a></li>
    <li><a (click)="navigateTo('student/tasks')" style="cursor: pointer;"><span>Task Tracker</span></a></li>
    <li><a (click)="navigateTo('student/team-creator')" style="cursor: pointer;"><span>Team Creator</span></a></li>
    <li><a (click)="navigateTo('student/announcements')" style="cursor: pointer;"><span>Announcement</span></a></li>
    <li><a (click)="navigateTo('student/materials')" style="cursor: pointer;"><span>Material Sources</span></a></li>
    <li><a (click)="navigateTo('map')" style="cursor: pointer;"><span>Map</span></a></li>
    <li><a (click)="navigateTo('student/faq')" style="cursor: pointer;"><span>FAQ</span></a></li>

    @if (isAdmin()) {
      <li class="admin-link">
        <a (click)="navigateTo('admin/dashboard')" style="cursor: pointer; border-top: 1px solid #eee; margin-top: 10px; padding-top: 10px;">
          <span style="color: #e11d48; font-weight: bold;">🛠 Admin Panel</span>
        </a>
      </li>
    }
  </ul>
</div>
