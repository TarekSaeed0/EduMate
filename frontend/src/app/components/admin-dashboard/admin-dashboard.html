<app-navbar></app-navbar>

<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <nav class="admin-nav">
      <button [class.active]="activeTab === 'courses'" (click)="activeTab = 'courses'">📚 Course Management</button>
      <button [class.active]="activeTab === 'tasks'" (click)="activeTab = 'tasks'">📋 Task Assignment</button>
      <button [class.active]="activeTab === 'enrollment'" (click)="activeTab = 'enrollment'">🎓 Student Enrollment</button>
    </nav>
  </aside>

  <main class="admin-main">

    <div *ngIf="activeTab === 'courses'">
      <div class="action-card">
        <h3>1. Create New Master Course</h3>
        <div class="form-grid">
          <div class="input-group">
            <label>Course Code</label>
            <input type="text" [(ngModel)]="newCourse.code" placeholder="CS101">
          </div>
          <div class="input-group">
            <label>Full Course Name</label>
            <input type="text" [(ngModel)]="newCourse.name" placeholder="Intro to Programming">
          </div>
        </div>
        <button class="btn-submit" (click)="saveCourse()">Add to Database</button>
      </div>

      <div class="action-card">
        <h3>2. Activate Course Offering</h3>
        <div class="form-grid">
          <div class="input-group">
            <label>Subject</label>
            <select [(ngModel)]="newOffering.course.id">
              <option [ngValue]="null">-- Select Subject --</option>
              <option *ngFor="let c of coursesList" [value]="c.id">{{c.name}}</option>
            </select>
          </div>
          <div class="input-group">
            <label>Semester</label>
            <select [(ngModel)]="newOffering.semesterId">
              <option [ngValue]="null">-- Select Semester --</option>
              <option *ngFor="let s of semestersList" [value]="s.id">{{s.term}} {{s.year}}</option>
            </select>
          </div>
        </div>
        <button class="btn-submit" (click)="saveOffering()">Open for Enrollment</button>
      </div>
    </div>

    <div *ngIf="activeTab === 'tasks'">
      <div class="action-card">
        <h3>Create & Assign Task</h3>
        <div class="form-grid">
          <div class="input-group">
            <label>Class Offering</label>
            <select [(ngModel)]="newTask.offering.id">
              <option [ngValue]="null">-- Select Class --</option>
              <option *ngFor="let off of offeringsList" [value]="off.id">{{off.course.name}} (ID: {{off.id}})</option>
            </select>
          </div>
          <div class="input-group">
            <label>Task Title</label>
            <input type="text" [(ngModel)]="newTask.title" placeholder="e.g. Midterm Project">
          </div>
          <div class="input-group">
            <label>Submission URL (Optional)</label>
            <input type="text" [(ngModel)]="newTask.submissionUrl" placeholder="https://link-to-portal.com">
          </div>
          <div class="input-group">
            <label>Due Date & Time</label>
            <input type="datetime-local" [(ngModel)]="newTask.dueDate">
          </div>
        </div>

        <div class="input-group" style="margin-top: 1rem;">
          <label>Requirements</label>
          <textarea [(ngModel)]="newTask.requirements" rows="3" placeholder="Explain what students need to do..."></textarea>
        </div>

        <div class="input-group" style="margin-top: 1rem;">
          <label>Internal Notes</label>
          <textarea [(ngModel)]="newTask.notes" rows="2" placeholder="Private notes for staff..."></textarea>
        </div>

        <button class="btn-submit" style="margin-top: 1.5rem;" (click)="saveTask()">Publish Task</button>
      </div>
    </div>

    <div *ngIf="activeTab === 'enrollment'">
      <div class="action-card">
        <h3>Student Enrollment</h3>
        <label>Pick the Class Instance:</label>
        <select [(ngModel)]="selectedOfferingId" (change)="checkEnrollmentStatus()" style="margin-bottom: 20px;">
          <option [ngValue]="null">-- SELECT CLASS --</option>
          <option *ngFor="let off of offeringsList" [value]="off.id">{{off.course.name}} (ID: {{off.id}})</option>
        </select>

        <table class="enroll-table">
          <tr *ngFor="let s of studentsList">
            <td>{{s.name}} ({{s.email}})</td>
            <td style="text-align: right;">
              <span *ngIf="enrolledStudentIds.includes(s.id)" class="status-badge">
                ✅ Already Enrolled
              </span>
              <button *ngIf="!enrolledStudentIds.includes(s.id)"
                      class="btn-enroll"
                      [disabled]="!selectedOfferingId"
                      (click)="enrollStudent(s.id, selectedOfferingId!)">
                + Enroll
              </button>
            </td>
          </tr>
        </table>
      </div>
    </div>

  </main>
</div>
